name: Build
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-build:
    name: go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compile all packages
        run: go build ./...

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -trimpath -o bin/smart-fridge-backend ./cmd/smart-fridge-backend

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smart-fridge-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
