name: OpenAPI Spectral check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  spectral-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: stoplightio/spectral-action@latest
        with:
          file_glob: api/*.yaml