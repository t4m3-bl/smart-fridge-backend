version: "2"

run:
  go: "1.27"
  tests: true
  build-tags:
    - integration

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: smart-fridge-backend
    goimports:
      local-prefixes:
        - smart-fridge-backend

linters:
  default: none
  enable:
    # --- base ---
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # --- errors and context ---
    - errorlint
    - errname
    - nilerr
    - contextcheck
    - noctx
    - fatcontext
      
    # --- database and resources ---
    - sqlclosecheck
    - rowserrcheck
    - bodyclose

    # --- correction and security ---
    - gosec
    - exhaustive
    - copyloopvar
    - wastedassign
    - unparam
    - recvcheck

    # --- styles ---
    - revive
    - gocritic
    - cyclop
    - misspell
    - perfsprint
    - prealloc
    - intrange
    - usestdlibvars
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - nolintlint

    # --- tests ---
    - thelper
    - tparallel
    - paralleltest
    - usetesting

    # --- architecture ---
    - depguard