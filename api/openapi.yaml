openapi: 3.1.0

info:
  title: Smart Fridge API
  description: Smart Fridge app backend API
  contact:
    name: korjeek
    email: olegka823@gmail.com
  version: 0.2.0

servers:
  - url: /api/v1
    description: Current host

tags:
  - name: auth
    description: User authentication and authorization
  - name: products
    description: Products stored in the user's fridge
  - name: categories
    description: Categories of products
  - name: settings
    description: User settings

security:
  - BearerAuth: [ ]

paths:
  /auth/sign-up:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a new user and returns an access token
      operationId: signUp
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/sign-in:
    post:
      tags:
        - auth
      summary: Sign in an existing user
      description: Returns an access token for valid credentials
      operationId: signIn
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh the token pair
      operationId: refresh
      security: [ ]
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - auth
      summary: Log out
      description: >
        Revokes the refresh token from the cookie and clears the cookie.
        Idempotent: returns 204 even if the token is already invalid.
      operationId: logout
      security: [ ]
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearedRefreshTokenCookie"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/{provider}/sign-in:
    get:
      tags:
        - auth
      summary: Start sign-in with an OAuth provider
      description: >
        Browser navigation endpoint (open it via window.location, not fetch/XHR).
        Generates state and PKCE verifier, stores them in short-lived HttpOnly
        cookies (oauth_state, oauth_verifier) scoped to /auth/{provider}
        and redirects the user to the provider's authorization page.
      operationId: oauthSignIn
      security: [ ]
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "302":
          description: Redirect to the provider's authorization page
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: "#/components/headers/OAuthTempCookie"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/{provider}/callback:
    get:
      tags:
        - auth
      summary: OAuth provider redirect target
      description: >
        Browser navigation endpoint called by the OAuth provider, not by the app.
        Verifies state, exchanges the code, finds or creates the user and sets
        the refresh cookie. The app then calls /auth/refresh to get an access token.
      operationId: oauthCallback
      security: [ ]
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user denied access
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Set by the provider when the user denied access
          schema:
            type: string
        - name: oauth_state
          in: cookie
          required: true
          schema:
            type: string
        - name: oauth_verifier
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect back to the app. Always clears the oauth_* cookies.
            On success the refresh cookie is set and the app calls /auth/refresh.
            On failure no refresh cookie is set and the query string contains `error`:
            `access_denied` (the user declined access),
            `email_required` (the provider did not return an email),
            `email_taken` (a user with this email already exists).
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /products:
    get:
      tags:
        - products
      summary: List the user's products
      description: >
        Returns the full current state of the user's products, each with its `version`.
        Deleted products are not included. The server is the source of truth: after
        sending its pending changes the client replaces its local copy with this list,
        keeping only products that still have pending changes.
      operationId: listProducts
      responses:
        "200":
          description: Current products of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}:
    put:
      tags:
        - products
      summary: Create or update a product
      description: >
        The id is generated by the client (UUID), so a product created offline can be
        sent later. Exactly one precondition is required.
        Create: `If-None-Match: *` -> 201; 412 if the id is already taken.
        Update: `If-Match: "<version>"` with the version last received from the server
        -> 200; 412 if the product does not exist or its version differs, nothing is written.
        Neither header -> 428. Both headers -> 400.
        The new version is returned in the `ETag` header and in `version`.
      operationId: upsertProduct
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
      responses:
        "200":
          description: The product was updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "201":
          description: The product was created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - products
      summary: Delete a product
      description: >
        Requires `If-Match: "<version>"`. 412 if the product does not exist (for example
        it was already deleted on another device) or its version differs; in that case
        nothing is deleted and the client refetches the list. Missing header -> 428.
      operationId: deleteProduct
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The product is deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{id}/image:
    post:
      tags:
        - products
      summary: Upload an image for a product
      description: >
        Uploads a binary image file for the product. Updates the product's `imageLink`
        internally. Requires `If-Match: "<version>"` of the product. 
        Returns the new version of the product in the `ETag` header.
      operationId: uploadProductImage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: The image file (png, jpeg, etc.)
      responses:
        "200":
          description: Image uploaded successfully. Returns the new product version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - products
      summary: Remove the image from a product
      description: >
        Deletes the product's image from storage and clears `imageLink` in the DB.
        Requires `If-Match: "<version>"`. Returns the new version of the product 
        in the `ETag` header.
      operationId: deleteProductImage
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Image deleted successfully. Returns the new product version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories:
    get:
      tags:
        - categories
      summary: List the user's categories
      description: >
        Returns the full current state of the user's categories, each with its `version`.
        Deleted categories are not included. The server is the source of truth: after
        sending its pending changes the client replaces its local copy with this list,
        keeping only categories that still have pending changes.
      operationId: listCategories
      responses:
        "200":
          description: Current categories of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories/{id}:
    put:
      tags:
        - categories
      summary: Create or update a category
      description: >
        Same preconditions as for products: `If-None-Match: *` to create (201),
        `If-Match: "<version>"` to update (200), 412 if it fails, 428 if neither is sent.
        409 if the user already has a category with this name.
      operationId: upsertCategory
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        "200":
          description: The category was updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "201":
          description: The category was created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - categories
      summary: Delete a category
      description: >
        Requires `If-Match: "<version>"`; 412 if the category does not exist or its
        version differs. 409 if the category still contains products: move or delete
        them first. Missing header -> 428.
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The category is deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings:
    get:
      tags:
        - settings
      summary: Get settings
      description: Returns user settings; the current version is in the `ETag` header and in `version`.
      operationId: getSettings
      responses:
        "200":
          $ref: "#/components/responses/SettingsSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - settings
      summary: Patch settings
      description: >
        Changes user settings. Requires `If-Match: "<version>"`; 412 if the version
        differs, 428 if the header is missing.
      operationId: patchSettings
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          $ref: "#/components/responses/SettingsSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Credentials:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    TokenResponse:
      type: object
      required: [ accessToken, tokenType, expiresIn ]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          enum: [ Bearer ]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    Error:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          description: Human-readable description
          example: user not found

    OAuthProviderName:
      type: string
      enum: [ yandex ]

    Product:
      description: A product in the user's fridge. All fields except `version` are set by the client (full replacement).
      type: object
      required: [ id, name, categoryId, expiresAt ]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 2000
        quantity:
          type: string
          maxLength: 100
        imageLink:
          type: string
          maxLength: 2048
        manufacturedAt:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
        openedAt:
          type: string
          format: date
        shelfLifeAfterOpening:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: Days the product stays good after it was opened
        version:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Set by the server; the same value is sent in the ETag header

    ProductList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    Category:
      description: Category of products.
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Dairy
        version:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Set by the server; the same value is sent in the ETag header

    CategoryList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Settings:
      description: User settings
      type: object
      properties:
        hasNotifications:
          type: boolean
        notificationTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "09:00:00"
        timezone:
          type: string
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"
        version:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Set by the server; the same value is sent in the ETag header

    Indicator:
      type: object
      required: [ color ]
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        maxDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OAuthProviderName"

    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Version the change is based on, in quotes, e.g. `"3"`: the `ETag` last received
        from the server. Required for updates and deletes (the server answers 428 if it
        is missing). Only a single strong tag is accepted: no lists, no `W/`, no `*`.
      schema:
        type: string
        example: '"3"'

    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >
        Must be exactly `*` when creating an entity: the request fails with 412 if the
        id already exists.
      schema:
        type: string
        example: "*"

  headers:
    ETag:
      description: Current version of the entity in quotes, e.g. `"4"`
      schema:
        type: string
        example: '"4"'
    RefreshTokenCookie:
      description: New refresh token
      schema:
        type: string
        example: refresh_token=abc123; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000
    ClearedRefreshTokenCookie:
      description: Expires the refresh cookie
      schema:
        type: string
        example: refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0
    OAuthTempCookie:
      description: >
        Short-lived cookies (oauth_state, oauth_verifier) used to validate the
        OAuth callback. Sent as two separate Set-Cookie headers.
      schema:
        type: string
        example: oauth_state=abc123; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/yandex; Max-Age=600

  responses:
    AuthSuccess:
      description: Access token in body, refresh token in HttpOnly cookie
      headers:
        Set-Cookie:
          $ref: "#/components/headers/RefreshTokenCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"
    SettingsSuccess:
      description: User settings
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Settings"

    BadRequest:
      description: Invalid request body, headers or validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown OAuth provider
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The request conflicts with the current state: the email is already registered,
        the category name is taken, or the category still contains products
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: >
        If-Match or If-None-Match did not hold: the entity does not exist, already exists,
        or has another version. Nothing was changed. The client drops its pending change
        and refetches.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: The required If-Match or If-None-Match header is missing
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: OAuth provider is unavailable or returned an error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT