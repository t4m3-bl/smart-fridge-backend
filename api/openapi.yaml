openapi: 3.1.0

info:
  title: Smart Fridge API
  description: Smart Fridge app backend API
  contact:
    name: korjeek
    email: olegka823@gmail.com
  version: 0.2.0

servers:
  - url: /api/v1
    description: Current host

tags:
  - name: auth
    description: User authentication and authorization
  - name: products
    description: Products stored in the user's fridge
  - name: categories
    description: Categories of products
  - name: settings
    description: User settings

security:
  - BearerAuth: []

paths:
  /auth/sign-up:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a new user and returns an access token
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/sign-in:
    post:
      tags:
        - auth
      summary: Sign in an existing user
      description: Returns an access token for valid credentials
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh the token pair
      operationId: refresh
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - auth
      summary: Log out
      description: >
        Revokes the refresh token from the cookie and clears the cookie.
        Idempotent: returns 204 even if the token is already invalid.
      operationId: logout
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearedRefreshTokenCookie"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/{provider}/sign-in:
    get:
      tags:
        - auth
      summary: Start sign-in with an OAuth provider
      description: >
        Browser navigation endpoint (open it via window.location, not fetch/XHR).
        Generates state and PKCE verifier, stores them in short-lived HttpOnly
        cookies (oauth_state, oauth_verifier) scoped to /auth/{provider}
        and redirects the user to the provider's authorization page.
      operationId: oauthSignIn
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "302":
          description: Redirect to the provider's authorization page
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: "#/components/headers/OAuthTempCookie"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/{provider}/callback:
    get:
      tags:
        - auth
      summary: OAuth provider redirect target
      description: >
        Browser navigation endpoint called by the OAuth provider, not by the app.
        Verifies state, exchanges the code, finds or creates the user and sets
        the refresh cookie. The app then calls /auth/refresh to get an access token.
      operationId: oauthCallback
      security: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user denied access
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Set by the provider when the user denied access
          schema:
            type: string
        - name: oauth_state
          in: cookie
          required: true
          schema:
            type: string
        - name: oauth_verifier
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect back to the app. Always clears the oauth_* cookies.
            On success the refresh cookie is set and the app calls /auth/refresh.
            On failure no refresh cookie is set and the query string contains `error`:
            `access_denied` (the user declined access),
            `email_required` (the provider did not return an email),
            `email_taken` (a user with this email already exists).
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /products:
    get:
      tags:
        - products
      summary: List the user's products
      description: >
        Returns the full current state of the user's products, each with its `version`.
        Deleted products are not included. The server is the source of truth: after
        sending its pending changes the client replaces its local copy with this list,
        keeping only products that still have pending changes.
      operationId: listProducts
      responses:
        "200":
          description: Current products of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/batch:
    post:
      tags:
        - products
      summary: Apply product changes
      description: 'Creates, updates or deletes products. Operations are processed independently.'
      operationId: batchProducts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductBatchRequest'
      responses:
        '200':
          description: 'Results for each operation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/images/batch:
    post:
      tags: [products]
      summary: Prepare image uploads
      description: Validates image operations and returns short-lived upload URLs.
      operationId: prepareProductImageUploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageBatchRequest"
      responses:
        "200":
          description: Upload URLs for each operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /products/images/batch/complete:
    post:
      tags: [ products ]
      summary: Complete image uploads
      description: >-
        Verifies uploaded files and returns their backend-issued image keys.
        The client attaches image keys to products through the product batch endpoint.
      operationId: completeProductImageUploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageCompleteRequest"
      responses:
        "200":
          description: Results for each completed upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageCompleteBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /categories:
    get:
      tags:
        - categories
      summary: List the user's categories
      description: Returns all available categories
      operationId: listCategories
      responses:
        "200":
          description: Current categories of the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings:
    get:
      tags:
        - settings
      summary: Get settings
      description: Returns the current user settings.
      operationId: getSettings
      responses:
        "200":
          $ref: "#/components/responses/SettingsSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      tags:
        - settings
      summary: Patch settings
      description: >-
        Applies all pending settings changes in one request.
      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          $ref: "#/components/responses/SettingsSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          description: Human-readable description
          example: user not found

    OAuthProviderName:
      type: string
      enum: [yandex]

    Product:
      description: A product in the user's fridge. Writable fields are supplied by the client;
        `id` and `version` are controlled by the server.
      type: object
      required: [id, name, categoryId, expiresAt, imageKey, version]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: integer
          format: int64
        description:
          type: string
          maxLength: 2000
        quantity:
          type: string
          maxLength: 100
        imageKey:
          type: [string, "null"]
          minLength: 1
          description: Storage object key issued by the backend; null when the product has no image.
        manufacturedAt:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
        openedAt:
          type: string
          format: date
        shelfLifeAfterOpening:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
          description: Days the product stays good after it was opened
        version:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
          description: Set by the server; the same value is sent in the ETag header

    ProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    Category:
      description: Category of products.
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Dairy

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Settings:
      description: User settings.
      type: object
      properties:
        hasNotifications:
          type: boolean
        notificationTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
          example: "09:00:00"
        timezone:
          type: string
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/Indicator"
    Indicator:
      type: object
      required: [color]
      properties:
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        maxDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    ProductFields:
      description: Writable product fields. Updates replace all writable fields.
      type: object
      required:
        - name
        - categoryId
        - expiresAt
        - imageKey
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        categoryId:
          type: integer
          format: int64
        description:
          type: string
          maxLength: 2000
        quantity:
          type: string
          maxLength: 100
        imageKey:
          type: [ string, "null" ]
          minLength: 1
          description: Backend-issued storage object key. Use null when the product has no image.
        manufacturedAt:
          type: string
          format: date
        expiresAt:
          type: string
          format: date
        openedAt:
          type: string
          format: date
        shelfLifeAfterOpening:
          type: integer
          format: int32
          minimum: 1
          maximum: 3650
    ProductCreateOperation:
      type: object
      required:
        - operationId
        - type
        - id
        - product
      properties:
        operationId:
          type: string
          format: uuid
          description: Client-provided identifier used to correlate this operation with its result.
        type:
          type: string
          const: create
        id:
          type: string
          format: uuid
          description: Product UUID generated by the client, including while offline.
        product:
          $ref: '#/components/schemas/ProductFields'
    ProductUpdateOperation:
      type: object
      required:
        - operationId
        - type
        - id
        - expectedVersion
        - product
      properties:
        operationId:
          type: string
          format: uuid
          description: Client-provided identifier used to correlate this operation with its result.
        type:
          type: string
          const: update
        id:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: Version last received from the server.
        product:
          $ref: '#/components/schemas/ProductFields'
    ProductDeleteOperation:
      type: object
      required:
        - operationId
        - type
        - id
        - expectedVersion
      properties:
        operationId:
          type: string
          format: uuid
          description: Client-provided identifier used to correlate this operation with its result.
        type:
          type: string
          const: delete
        id:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          format: int32
          minimum: 1
          description: Version last received from the server.
    ProductBatchOperation:
      oneOf:
        - $ref: '#/components/schemas/ProductCreateOperation'
        - $ref: '#/components/schemas/ProductUpdateOperation'
        - $ref: '#/components/schemas/ProductDeleteOperation'
      discriminator:
        propertyName: type
        mapping:
          create: '#/components/schemas/ProductCreateOperation'
          update: '#/components/schemas/ProductUpdateOperation'
          delete: '#/components/schemas/ProductDeleteOperation'
    ProductBatchRequest:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProductBatchOperation'
          description: Operations are processed independently in request order.
    ProductBatchResult:
      type: object
      required:
        - operationId
        - id
      properties:
        operationId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/Product'
          description: >
            Resulting product after successful operation,
            or current product when an operation conflicts.
        error:
          $ref: '#/components/schemas/Error'
    ProductBatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductBatchResult'
          description: One result per submitted operation, in request order.
    ProductImageUpload:
      type: object
      required: [ operationId, contentType, fileSize ]
      properties:
        operationId:
          type: string
          format: uuid
        contentType:
          type: string
          enum: [ image/jpeg, image/png, image/webp ]
    ProductImageBatchRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProductImageUpload"
    ProductImageUploadTarget:
      type: object
      required: [operationId, uploadUrl, objectId, expiresAt, requiredHeaders]
      properties:
        operationId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          description: Short-lived presigned URL. Do not persist or share it.
        objectId:
          type: string
          description: Opaque upload identifier used to complete the upload.
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    ProductImageBatchResponse:
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageUploadTarget"
    ProductImageCompleteItem:
      type: object
      required: [ operationId, objectId ]
      properties:
        operationId:
          type: string
          format: uuid
        objectId:
          type: string
    ProductImageCompleteRequest:
      type: object
      required: [uploads]
      properties:
        uploads:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProductImageCompleteItem"
      description: Uploaded objects to verify and obtain backend-issued image keys.
    ProductImageCompleteResultItem:
      type: object
      required: [ operationId ]
      properties:
        operationId:
          type: string
          format: uuid
        imageKey:
          type: string
          description: Backend-issued storage object key.
        error:
          $ref: "#/components/schemas/Error"
    ProductImageCompleteBatchResponse:
      type: object
      required: [ results ]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ProductImageCompleteResultItem"
  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OAuthProviderName"

  headers:
    ETag:
      description: Current version of the entity in quotes, e.g. `"4"`
      schema:
        type: string
        example: '"4"'
    RefreshTokenCookie:
      description: New refresh token
      schema:
        type: string
        example: refresh_token=abc123; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth;
          Max-Age=2592000
    ClearedRefreshTokenCookie:
      description: Expires the refresh cookie
      schema:
        type: string
        example: refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0
    OAuthTempCookie:
      description: >
        Short-lived cookies (oauth_state, oauth_verifier) used to validate the
        OAuth callback. Sent as two separate Set-Cookie headers.
      schema:
        type: string
        example: oauth_state=abc123; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/yandex;
          Max-Age=600

  responses:
    AuthSuccess:
      description: Access token in body, refresh token in HttpOnly cookie
      headers:
        Set-Cookie:
          $ref: "#/components/headers/RefreshTokenCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"
    SettingsSuccess:
      description: User settings.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Settings"

    BadRequest:
      description: Invalid request body, headers or validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown OAuth provider
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required external service is currently unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The request conflicts with the current state: the email is already registered,
        the category name is taken, or the category still contains products
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionFailed:
      description: The entity changed before the update could be committed. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: The required If-Match or If-None-Match header is missing
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: An upstream service, such as the image storage provider, is unavailable or returned an error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
