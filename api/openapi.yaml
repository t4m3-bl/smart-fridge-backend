openapi: 3.1.0

info:
  title: Smart Fridge API
  description: Smart Fridge app backend API
  contact:
    name: korjeek
    email: olegka823@gmail.com
  version: 0.1.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: auth
    description: User authentication and authorization
  - name: sync
    description: Offline-first synchronization

security:
  - BearerAuth: [ ]

paths:
  /auth/sign-up:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Creates a new user and returns an access token
      operationId: signUp
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: User Created
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/sign-in:
    post:
      tags:
        - auth
      summary: Sign in an existing user
      description: Returns an access token for valid credentials
      operationId: signIn
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: User sign in
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/refresh:
    post:
      tags:
        - auth
      summary: Refresh the token pair
      operationId: refresh
      security: [ ]
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      tags:
        - auth
      summary: Log out
      description: >
        Revokes the refresh token from the cookie and clears the cookie.
        Idempotent: returns 204 even if the token is already invalid.
      operationId: logout
      security: [ ]
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Logged out
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearedRefreshTokenCookie"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/{provider}/sign-in:
    get:
      tags:
        - auth
      summary: Start sign-in with an OAuth provider
      description: >
        Browser navigation endpoint (open it via window.location, not fetch/XHR).
        Generates state and PKCE verifier, stores them in short-lived HttpOnly
        cookies (oauth_state, oauth_verifier) scoped to /auth/{provider}
        and redirects the user to the provider's authorization page.
      operationId: oauthSignIn
      security: [ ]
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "302":
          description: Redirect to the provider's authorization page
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: "#/components/headers/OAuthTempCookie"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/{provider}/callback:
    get:
      tags:
        - auth
      summary: OAuth provider redirect target
      description: >
        Browser navigation endpoint called by the OAuth provider, not by the app.
        Verifies state, exchanges the code, finds or creates the user and sets
        the refresh cookie. The app then calls /auth/refresh to get an access token.
      operationId: oauthCallback
      security: [ ]
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Set by the provider when the user denied access
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          description: Set by the provider when the user denied access
          schema:
            type: string
        - name: oauth_state
          in: cookie
          required: true
          schema:
            type: string
        - name: oauth_verifier
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "302":
          description: >
            Redirect back to the app. Always clears the oauth_* cookies.
            On success the refresh cookie is set and the app calls /auth/refresh.
            On failure no refresh cookie is set and the query string contains `error`:
            `access_denied` (the user declined access),
            `email_required` (the provider did not return an email),
            `email_taken` (a user with this email already exists).
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: "#/components/headers/RefreshTokenCookie"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /sync/push:
    post:
      tags: [ sync ]
      summary: Apply queued client mutations
      description: >
        Mutations are applied in request order; the last applied mutation wins.
        Every mutation gets its own result, so a rejected mutation does not
        affect the others. A mutation with an already processed mutationId is
        not applied again; its previous result is returned. After a push the
        client calls /sync/pull to receive the changes.
      operationId: push
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRequest" }
      responses:
        "200":
          description: Results in request order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  /sync/pull:
    get:
      tags: [ sync ]
      summary: Get applied mutations after the cursor
      description: >
        Returns applied mutations with seq greater than `since`, ordered by seq,
        including the client's own ones. since=0 returns everything.
      operationId: pull
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: A page of changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalServerError" }

components:
  schemas:
    Credentials:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72

    TokenResponse:
      type: object
      required: [ accessToken, tokenType, expiresIn ]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          enum: [ Bearer ]
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
          example: 900

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: not_found
        message:
          type: string
          description: Human-readable description
          example: user not found

    OAuthProviderName:
      type: string
      enum: [ yandex ]

    PushRequest:
      type: object
      required: [ mutations ]
      properties:
        mutations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/Mutation" }

    MutationType:
      type: string
      enum: [ createProduct, updateProduct, deleteProduct ]

    Mutation:
      oneOf:
        - $ref: "#/components/schemas/CreateProductMutation"
        - $ref: "#/components/schemas/UpdateProductMutation"
        - $ref: "#/components/schemas/DeleteProductMutation"
      discriminator:
        propertyName: type
        mapping:
          createProduct: "#/components/schemas/CreateProductMutation"
          updateProduct: "#/components/schemas/UpdateProductMutation"
          deleteProduct: "#/components/schemas/DeleteProductMutation"

    CreateProductMutation:
      type: object
      required: [ type, mutationId, productId, data ]
      properties:
        type: { type: string, enum: [ createProduct ] }
        mutationId: { type: string, format: uuid, description: "Unique per mutation, created by the client" }
        productId: { type: string, format: uuid, description: "Product id, created by the client" }
        data: { $ref: "#/components/schemas/ProductData" }

    UpdateProductMutation:
      type: object
      required: [ type, mutationId, productId, data ]
      description: Replaces all product fields; omitted optional fields are cleared
      properties:
        type: { type: string, enum: [ updateProduct ] }
        mutationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        data: { $ref: "#/components/schemas/ProductData" }

    DeleteProductMutation:
      type: object
      required: [ type, mutationId, productId ]
      properties:
        type: { type: string, enum: [ deleteProduct ] }
        mutationId: { type: string, format: uuid }
        productId: { type: string, format: uuid }

    ProductData:
      type: object
      required: [ name, expiresAt ]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        categoryId: { type: string, format: uuid }
        description: { type: string, maxLength: 500 }
        quantity: { type: string, maxLength: 50 }
        imageLink: { type: string, format: uri, maxLength: 2048 }
        manufacturedAt: { type: string, format: date }
        expiresAt: { type: string, format: date }
        openedAt: { type: string, format: date }
        shelfLifeAfterOpening: { type: integer, format: int32, minimum: 1, maximum: 3650, description: "Days the product keeps after opening" }

    PushResponse:
      type: object
      required: [ results ]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/MutationResult" }

    MutationResult:
      oneOf:
        - $ref: "#/components/schemas/MutationApplied"
        - $ref: "#/components/schemas/MutationRejected"
      discriminator:
        propertyName: status
        mapping:
          applied: "#/components/schemas/MutationApplied"
          rejected: "#/components/schemas/MutationRejected"

    MutationApplied:
      type: object
      required: [ status, mutationId, seq ]
      properties:
        status: { type: string, enum: [ applied ] }
        mutationId: { type: string, format: uuid }
        seq: { type: integer, format: int64 }

    MutationRejected:
      type: object
      required: [ status, mutationId, reason, message ]
      properties:
        status: { type: string, enum: [ rejected ] }
        mutationId: { type: string, format: uuid }
        reason:
          type: string
          enum: [ validation_error, not_found, already_exists ]
          description: >
            validation_error: invalid product data;
            not_found: the product or the category does not exist (or was deleted);
            already_exists: a product with this id already exists
        message: { type: string }

    AppliedMutation:
      type: object
      required: [ seq, mutationId, type, productId, createdAt ]
      properties:
        seq: { type: integer, format: int64 }
        mutationId: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/MutationType" }
        productId: { type: string, format: uuid }
        data:
          description: Present for createProduct and updateProduct
          allOf:
            - $ref: "#/components/schemas/ProductData"
        createdAt: { type: string, format: date-time, description: "When the server applied the mutation" }

    PullResponse:
      type: object
      required: [ mutations, cursor, hasMore ]
      properties:
        mutations: { type: array, items: { $ref: "#/components/schemas/AppliedMutation" } }
        cursor: { type: integer, format: int64, description: "Pass as `since` in the next call" }
        hasMore: { type: boolean }

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/OAuthProviderName"

  headers:
    RefreshTokenCookie:
      description: New refresh token
      schema:
        type: string
        example: refresh_token=abc123; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=2592000
    ClearedRefreshTokenCookie:
      description: Expires the refresh cookie
      schema:
        type: string
        example: refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth; Max-Age=0
    OAuthTempCookie:
      description: >
        Short-lived cookies (oauth_state, oauth_verifier) used to validate the
        OAuth callback. Sent as two separate Set-Cookie headers.
      schema:
        type: string
        example: oauth_state=abc123; HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth/yandex; Max-Age=600

  responses:
    AuthSuccess:
      description: Access token in body, refresh token in HttpOnly cookie
      headers:
        Set-Cookie:
          $ref: "#/components/headers/RefreshTokenCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TokenResponse"

    BadRequest:
      description: Invalid request body or validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown OAuth provider
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A user with this email already exists
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: OAuth provider is unavailable or returned an error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT