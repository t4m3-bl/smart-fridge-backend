services:
  smart-fridge-backend:
    build: .
    image: smart-fridge-backend:latest
    ports:
      - "8080:8080"
    environment:
      SMART_FRIDGE_AUTH_JWT_SECRET: ${SMART_FRIDGE_AUTH_JWT_SECRET}
      SMART_FRIDGE_OAUTH_YANDEX_CLIENT_ID: ${SMART_FRIDGE_OAUTH_YANDEX_CLIENT_ID}
      SMART_FRIDGE_OAUTH_YANDEX_CLIENT_SECRET: ${SMART_FRIDGE_OAUTH_YANDEX_CLIENT_SECRET}
      SMART_FRIDGE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: smart-fridge-backend:latest
    entrypoint: ["/goose", "-dir", "/migrations"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
