version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/repository/postgres/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: citext
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
